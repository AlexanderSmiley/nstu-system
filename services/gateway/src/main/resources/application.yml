spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          # Requests are forwarded with their original path: no StripPrefix filter
          # is configured, so a downstream service receives the full /api/... path.
          # URIs come from `nstu.routes.*`, which in turn read the NSTU_ROUTES_*
          # environment variables (see below).
          routes:
            - id: auth-service
              uri: ${nstu.routes.auth-uri}
              predicates:
                - Path=/api/auth/**
            - id: auth-site
              # Public site name and icon for the login / password-change screens
              # (design.md D27, change add-site-icon); served by auth-service under
              # the same base URI as /api/auth/**. GET /api/site/icon is also in
              # GatewayRouteMatcher's public allowlist.
              uri: ${nstu.routes.auth-uri}
              predicates:
                - Path=/api/site,/api/site/**
                - Method=GET
            - id: auth-users
              # Administrator user management (tasks 5.8/5.11); prefix is forwarded
              # unchanged, and the route is NOT in the public allowlist, so a token
              # is mandatory.
              uri: ${nstu.routes.auth-uri}
              predicates:
                - Path=/api/users/**
            - id: auth-admin
              # Administration endpoints (e.g. site settings, task 5.12); token required.
              uri: ${nstu.routes.auth-uri}
              predicates:
                - Path=/api/admin/**
            - id: student-service
              uri: ${nstu.routes.student-uri}
              predicates:
                - Path=/api/students/**
            - id: event-service
              uri: ${nstu.routes.event-uri}
              predicates:
                - Path=/api/events/**
            - id: calendar
              # Calendar module (change add-calendar-module), served by event-service
              # under the same base URI. Not in the public allowlist: a token (guest
              # sessions included) is mandatory.
              uri: ${nstu.routes.event-uri}
              predicates:
                - Path=/api/calendar/**
            - id: notes
              # Personal notes module (change add-notes-module), served by
              # student-service under the same base URI. Not in the public
              # allowlist: an access token (guest sessions included) is mandatory;
              # the service itself rejects guests with 403.
              uri: ${nstu.routes.student-uri}
              predicates:
                - Path=/api/notes/**
            - id: notification-service
              uri: ${nstu.routes.notification-uri}
              predicates:
                - Path=/api/notifications/**

server:
  port: 8080
  # Honour X-Forwarded-* from the reverse proxy (NPM): the scheme from
  # X-Forwarded-Proto is used for same-origin checks behind HTTPS.
  forward-headers-strategy: framework

nstu:
  jwt:
    # The shared HS256 secret (>= 32 bytes). Never committed; supplied via .env.
    secret: ${JWT_SECRET}
  routes:
    # Defaults target the docker-compose DNS names; override per host with the
    # matching NSTU_ROUTES_* variable when running the services locally.
    auth-uri: ${NSTU_ROUTES_AUTH_URI:http://auth-service:8081}
    student-uri: ${NSTU_ROUTES_STUDENT_URI:http://student-service:8082}
    event-uri: ${NSTU_ROUTES_EVENT_URI:http://event-service:8083}
    notification-uri: ${NSTU_ROUTES_NOTIFICATION_URI:http://notification-service:8084}
  cors:
    # Comma-separated list of allowed origins.
    allowed-origins: ${NSTU_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
