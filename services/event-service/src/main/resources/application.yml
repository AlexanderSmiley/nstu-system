spring:
  application:
    name: event-service

  # Datasource is supplied by the environment
  # (SPRING_DATASOURCE_URL=...currentSchema=event, SPRING_DATASOURCE_USERNAME,
  #  SPRING_DATASOURCE_PASSWORD) and by Testcontainers (@ServiceConnection) in tests.
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: event
    default-schema: event
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: event

  # RabbitMQ connection (design.md D13, D21). docker-compose passes
  # SPRING_RABBITMQ_* straight through; the defaults allow a local run against a
  # broker on localhost. The topology (exchange, DLQ, converter) comes from
  # ru.nstu:contracts' NstuRabbitConfig, which is picked up by the component scan.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: 8083

nstu:
  jwt:
    # HS256 secret (>= 32 bytes), supplied by the environment; never committed.
    secret: ${JWT_SECRET}
    issuer: nstu-system
    access-ttl: PT15M
  # Synchronous service-to-service call used when an account joins the queue
  # without an explicit name (design.md D12): GET {url}/internal/students/{id}.
  # docker-compose supplies both values (STUDENT_SERVICE_URL, INTERNAL_TOKEN).
  student-service:
    url: ${STUDENT_SERVICE_URL:http://localhost:8082}
  internal:
    # Shared secret for the X-Internal-Token header of /internal/** (design.md D12).
    # Blank/unset makes student-service reject the call (fail closed).
    token: ${INTERNAL_TOKEN:}
  outbox:
    # event-service owns event.outbox (design.md D2, D13).
    schema: event
    poll-interval: PT5S
  archive:
    # Retention sweep interval (design.md D19; ISO-8601 duration).
    sweep-interval: PT10M

management:
  endpoints:
    web:
      exposure:
        include: health,info
