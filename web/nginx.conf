server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Базовые security-заголовки.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP для SPA: только локальные ресурсы (Vite-сборка не тянет внешние CDN),
    # стили собираются inline-safe, data: разрешён для картинок.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Проксирование API в gateway без срезания префикса /api:
    # в gateway маршруты начинаются с /api/.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA-раздача с поддержкой клиентского роутинга.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
