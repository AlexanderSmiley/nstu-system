# Пробрасываем X-Forwarded-Proto от внешнего reverse-proxy (Nginx Proxy Manager,
# терминирующего TLS) как есть; если заголовка нет (прямой доступ) — берём $scheme.
map $http_x_forwarded_proto $nstu_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Разрешаем multipart-загрузки (вложения заметок до 10 МБ). Значение с запасом
    # выше серверных лимитов (11MB/12MB в student-service), чтобы превышение
    # отклонял сервис с JSON-ошибкой attachment_too_large, а не nginx с HTML-страницей.
    client_max_body_size 16m;

    # Базовые security-заголовки.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP для SPA: только локальные ресурсы (Vite-сборка не тянет внешние CDN),
    # стили собираются inline-safe, data: разрешён для картинок.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Проксирование API в gateway без срезания префикса /api:
    # в gateway маршруты начинаются с /api/.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nstu_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA-раздача с поддержкой клиентского роутинга.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
